server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript image/svg+xml;

    # SECURITY HEADERS ARE REPEATED IN EVERY LOCATION BELOW, NOT SET HERE.
    #
    # nginx's add_header does not inherit: a location block that declares ANY
    # add_header discards every inherited one from the server block. Declaring
    # them once at server level silently served NONE of them, because the
    # asset, .html$ and /health locations each set Cache-Control or
    # Content-Type. Measured before this change:
    #     curl -sSI .../app.$DOMAIN/ | grep -ci 'x-frame-options|content-security'
    #     -> 0
    #
    # The monograph service sends a strict nonce-based CSP, so the project
    # already knows the correct posture; the web client just never delivered it.
    #
    # connect-src needs `https:` because the client calls sync/auth/sse on
    # separate origins, all of which are https behind the TLS terminator.
    # `wss:` covers the SSE stream. Keep them in step with .env.example.

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src self; script-src self unsafe-inline unsafe-eval; style-src self unsafe-inline; img-src self data: https:; font-src self data:; connect-src self https: wss: ws:; media-src self; object-src none; frame-ancestors self; form-action self; base-uri self;" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src self; script-src self unsafe-inline unsafe-eval; style-src self unsafe-inline; img-src self data: https:; font-src self data:; connect-src self https: wss: ws:; media-src self; object-src none; frame-ancestors self; form-action self; base-uri self;" always;
        }
    }

    # A bare directory request never matches the .html$ block above (there is no
    # dot in "/"), so the SPA entry point got no security headers even after
    # the .html$ fix. This one exists so "/" itself is covered.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src self; script-src self unsafe-inline unsafe-eval; style-src self unsafe-inline; img-src self data: https:; font-src self data:; connect-src self https: wss: ws:; media-src self; object-src none; frame-ancestors self; form-action self; base-uri self;" always;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src self; frame-ancestors self; base-uri self;" always;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
