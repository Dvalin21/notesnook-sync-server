# Garage S3 overlay for notesnook-sync-server
#
# Usage:
#   docker compose -f docker-compose.yml -f examples/garage/docker-compose.garage.yml up -d
#
# Replaces MinIO with Garage S3-compatible object storage.
# Garage image: dxflrs/garage:v2.1.0
# S3 API: port 3900 (internal)
# Admin API: port 3903

services:
  # Replace notesnook-s3 (MinIO) with garage
  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    volumes:
      - s3data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
      - ./examples/garage/garage.toml:/etc/garage.toml:ro
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET:-}
      - GARAGE_HTTP_TOKEN=${GARAGE_HTTP_TOKEN:-}
    networks:
      - notesnook
    depends_on:
      validate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3903/health"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Replace setup-s3 (MinIO mc) with Garage bucket setup
  # Uses setup-garage.sh which implements proper AWS SigV4 signing
  setup-garage:
    image: curlimages/curl:latest
    restart: "no"
    depends_on:
      - garage
    networks:
      - notesnook
    env_file: .env
    environment:
      - GARAGE_S3_HOST=garage
      - GARAGE_S3_PORT=3900
      - BUCKET_NAME=attachments
    volumes:
      - ./examples/garage/setup-garage.sh:/setup-garage.sh:ro
    entrypoint: /bin/sh
    command: /setup-garage.sh

  # Override notesnook-server to point at garage instead of minio
  notesnook-server:
    environment:
      S3_INTERNAL_SERVICE_URL: "http://garage:3900"
      S3_INTERNAL_BUCKET_NAME: "attachments"
      S3_ACCESS_KEY_ID: "${GARAGE_ACCESS_KEY_ID:-}"
      S3_ACCESS_KEY: "${GARAGE_ACCESS_KEY_SECRET:-}"
      S3_SERVICE_URL: "${ATTACHMENTS_SERVER_PUBLIC_URL}"
      S3_REGION: "us-east-1"
      S3_BUCKET_NAME: "attachments"

volumes:
  s3data:
  garage-meta:
