networks:
  # The subnet is pinned, not left to Docker's auto-assignment, because the
  # caddy service pins an address inside it (see the caddy service comment).
  #
  # 10.203.0.0/24 is deliberately OUTSIDE the 172.17.0.0/16 - 172.31.0.0/16
  # range Docker allocates user-defined networks from. If this subnet sat
  # inside that range, Docker could assign it to some other network first and
  # this stack's static address would be unroutable -- the same failure the pin
  # existed to avoid. Pick any /24 in 10.x that you do not already use.
  #
  # To change it: update this subnet, CADDY_IP in .env (the .12 suffix is
  # arbitrary but must stay inside the subnet), and nothing else. `validate`
  # enforces that CADDY_IP == KNOWN_PROXIES on every boot.
  notesnook:
    ipam:
      config:
        - subnet: 10.203.0.0/24

# ── shared defaults ────────────────────────────────────────────────────────
# Merge with `<<: *svc` so restart policy and log rotation are applied BY
# CONSTRUCTION. Previously 8 of 16 services had no restart policy and none had
# log rotation, and both were only ever fixed by hand.
# One-shot services merge this too, then override `restart: "no"`.
x-svc: &svc
  restart: unless-stopped
  networks:
  - notesnook
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Service-discovery block shared by every Notesnook service. Merge with
# `<<: *app-env`. Was copy-pasted into five service blocks verbatim.
x-app-env: &app-env
  IDENTITY_SERVER_HOST: identity-server
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_URL: ${AUTH_SERVER_PUBLIC_URL}
  NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_HOST}
  NOTESNOOK_SERVER_HOST: notesnook-server
  NOTESNOOK_SERVER_PORT: 5264
  SELF_HOSTED: ${SELF_HOSTED:-1}
  SSE_SERVER_HOST: sse-server
  SSE_SERVER_PORT: 7264

x-envfile: &envfile
- .env

services:
  caddy:
    <<: *svc
    # Pinned because the .NET services must name their immediate upstream in
    # KNOWN_PROXIES, and their immediate upstream is THIS container, not the
    # TLS terminator in front of it. Docker assigns 172.19.0.x on a best-effort
    # basis and the address moves whenever this container is recreated -- which
    # is every time the Caddyfile changes, since `admin off` means a recreate
    # is the only way to reload. An unpinned address would silently re-break
    # forwarded headers on the next edit.
    #
    # The pin needs a SUBNET, and the subnet must not be one Docker assigns on
    # its own. That is what the `ipam` block at the bottom of this file is for.
    # Without it, `ipv4_address` forces Docker to allocate whichever pool
    # contains that address, and a second checkout on a host that already owns
    # 172.19.0.0/16 dies before any container starts:
    #
    #   invalid endpoint settings: no configured subnet contains IP address
    #   172.19.0.12
    #
    # Docker hands out 172.17.0.0/16 upward, one /16 per network, in creation
    # order, so which pool this stack lands in depends entirely on what already
    # exists on the host. Pinning an address inside Docker's own auto-assigned
    # range is "works on my box". Pinning the SUBNET too makes it deterministic
    # on any host.
    #
    # CADDY_IP is the single source of truth: the address below, and
    # KNOWN_PROXIES in .env, are both required to equal it. `validate` fails the
    # boot if they disagree, because the failure mode is invisible -- every
    # healthcheck passes and only sign-in breaks, with the discovery document
    # advertising http:// instead of https://.
    #
    # Do NOT "simplify" this by dropping the pin. Commit 1690bf7 records exactly
    # what happens: the identity server then issues http:// URLs, and token
    # introspection fails with
    #   "Endpoint belongs to different authority: http://auth.<domain>/..."
    # while the stack still reports healthy.
    networks:
      notesnook:
        ipv4_address: ${CADDY_IP:?CADDY_IP not set - must match KNOWN_PROXIES in .env}
    depends_on:
      cors-proxy:
        condition: service_healthy
      identity-server:
        condition: service_healthy
      monograph-server:
        condition: service_healthy
      notesnook-s3:
        condition: service_healthy
      notesnook-server:
        condition: service_healthy
      sse-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    environment:
      DOMAIN: ${SERVER_DOMAIN:-localhost}
      NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_HOST}
      # So the Caddyfile can answer 404 on minio.<domain> instead of proxying to
      # a console that is not running. Same value MinIO itself is given.
      MINIO_CONSOLE: ${MINIO_CONSOLE:-off}
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:80/health
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: caddy:alpine
    ports:
    - 8080:80
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro

  cors-proxy:
    <<: *svc
    # Published image, not just a local build. Before this had an image: tag
    # the published dvalin21/notesnook-cors-proxy was never used, so the
    # security fixes below only existed on whichever machine built them.
    # build: is kept as an opt-in override for local development.
    image: dvalin21/notesnook-cors-proxy:latest
    build: ./cors-proxy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    # No env_file here, deliberately. This is the only service reachable
    # without authentication, and it reads exactly seven variables
    # (ALLOWED_DOMAINS, ALLOWED_ORIGINS, HOST, NODE_ENV, PORT, RATE_LIMIT,
    # RATE_WINDOW_MS) -- six of which are passed below, and NODE_ENV has a
    # default in the code. env_file was therefore handing this service the
    # Mongo root password, the MinIO root password, the SMTP password and
    # NOTESNOOK_API_SECRET, none of which it can read.
    environment:
      ALLOWED_ORIGINS: ${NOTESNOOK_CORS_ORIGINS}
      # ponytail: this service is an internet-facing fetch proxy, so it needs a
      # domain allowlist AND a per-client rate limit. Empty ALLOWED_DOMAINS
      # means "allow anything" -- do not leave it unset. Extend it when an
      # image fails to render; a rejected host answers 400 and logs the URL.
      ALLOWED_DOMAINS: ${NOTESNOOK_CORS_DOMAINS:-imgur.com,wikimedia.org,githubusercontent.com,github.com,github.io,youtube.com,youtube-nocookie.com,redd.it,redditmedia.com}
      RATE_LIMIT: ${CORS_RATE_LIMIT:-120}
      RATE_WINDOW_MS: ${CORS_RATE_WINDOW_MS:-60000}
      HOST: 0.0.0.0
      PORT: 3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok?0:1)).catch(() =>
        process.exit(1))
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 30s

  identity-server:
    <<: *svc
    depends_on:
      notesnook-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # env_file replaced by an explicit list. The full .env handed this service
    # MINIO_ROOT_PASSWORD and S3_ACCESS_KEY as well, so a compromise of the
    # identity server was also a compromise of object storage -- including the
    # bucket-scoped credential the notes API holds. Everything this service
    # actually reads is listed below (see Streetwriters.Common/Constants.cs):
    # its own Mongo connection, SMTP/Twilio, the API secret it signs with,
    # instance name, feature toggles, CORS origins and the proxy trust list.
    environment:
      <<: *app-env
      ASPNETCORE_ENVIRONMENT: Production
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_USER}:${MONGO_PASS}@notesnook-db:27017/identity?replSet=rs0&authSource=admin
      MONGODB_DATABASE_NAME: identity
      MongoDbSettings__ConnectionString: mongodb://${MONGO_USER}:${MONGO_PASS}@notesnook-db:27017/identity?replicaSet=rs0&tls=false&directConnection=true&authSource=admin
      MongoDbSettings__DatabaseName: identity
      # SMTP -- required for confirmation, password reset and email 2FA. Without
      # these the signup path throws AFTER creating the user row, so the API
      # answers 400 while the account exists (documented in
      # PRODUCTION-READINESS.md P0-1). Only this service talks to SMTP.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REPLYTO_EMAIL: ${SMTP_REPLYTO_EMAIL:-}
      NOTESNOOK_SENDER_EMAIL: ${NOTESNOOK_SENDER_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      # SMS 2FA, optional.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SERVICE_SID: ${TWILIO_SERVICE_SID:-}
      # Instance behaviour.
      INSTANCE_NAME: ${INSTANCE_NAME}
      SELF_HOSTED: ${SELF_HOSTED:-1}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      NOTESNOOK_CORS_ORIGINS: ${NOTESNOOK_CORS_ORIGINS}
      KNOWN_PROXIES: ${KNOWN_PROXIES}
      # This service SIGNS tokens with this secret and the notes API
      # introspects against it (Config.ApiResources ApiSecret, and the
      # OAuth2Introspection ClientSecret on the notes side). Both halves are
      # required to be the same value; a mismatch is a 500 on every login.
      NOTESNOOK_API_SECRET: ${NOTESNOOK_API_SECRET}
    # ponytail: was `nc -z 8264`, which passes the moment the socket binds --
    # before the app has resolved Mongo or read its config. A broken service
    # reported healthy and Caddy routed live traffic into it.
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:8264/health
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: dvalin21/notesnook-identity:latest
    volumes:
    - dpdata-identity:/app/.aspnet/DataProtection-Keys
    - keystore-data:/app/keystore
    # The GPG keyring that signs outbound mail (entrypoint.sh sets
    # GNUPGHOME here). This MUST be a volume: it was an unmounted path in the
    # container layer, so every recreate silently generated a new signing key
    # and the old one was destroyed with the container. It was also never in any
    # backup -- backup.sh archived keystore-data, which is a different directory.
    # init-dpdata chowns it to uid 1000 so the non-root app user can write.
    - gnupg-identity:/app/.gnupg

  inbox-api:
    <<: *svc
    depends_on:
      notesnook-server:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      NOTESNOOK_API_SERVER_URL: http://notesnook-server:5264
      PORT: 5181
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - fetch('http://127.0.0.1:5181/health').then(r => { if (!r.ok) process.exit(1);
        }).catch(() => process.exit(1))
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: streetwriters/notesnook-inbox:latest

  init-dpdata:
    <<: *svc
    restart: "no"
    command:
    - sh
    - -c
    - 'echo "Setting DataProtection volume permissions..."

      chown -R 1000:1000 /data/identity /data/notesnook /data/sse /data/keystore /data/gnupg

      echo "Done."

      '
    depends_on:
      validate:
        condition: service_completed_successfully
    image: alpine:latest
    volumes:
    - dpdata-identity:/data/identity
    - dpdata-notesnook:/data/notesnook
    - dpdata-sse:/data/sse
    - keystore-data:/data/keystore
    - gnupg-identity:/data/gnupg

  init-mongo-key:
    <<: *svc
    restart: "no"
    # mongod runs as uid 999 in the official image and REJECTS a keyfile it does
    # not own -- "error opening file: /run/secrets/mongo-keyfile: bad file".
    # A host-side file bind-mounted in arrives owned by whoever ran the install,
    # so the ownership could never be right, and nothing in the stack corrected
    # it. Generating the keyfile here means it is created, owned and
    # permissioned by the same rootful init service that already fixes the
    # DataProtection volumes for uid 1000.
    #
    # head+base64 rather than openssl, so a fresh install needs no package
    # download at boot. 756 random bytes -> 1008 base64 chars, inside MongoDB's
    # 6-1024 limit, and base64 is the only character set it accepts.
    entrypoint: /bin/sh
    command:
    - -c
    - |
      set -eu
      if [ -s /key/mongo-keyfile ]; then
        echo "  mongo keyfile already present, keeping it"
      else
        head -c 756 /dev/urandom | base64 | tr -d '\n' > /key/mongo-keyfile
        echo "  generated a new replica-set keyfile"
      fi
      chown 999:999 /key/mongo-keyfile
      chmod 400 /key/mongo-keyfile
      ls -ln /key/mongo-keyfile | sed "s/^/  keyfile /"
    depends_on:
      validate:
        condition: service_completed_successfully
    image: alpine:3.21
    volumes:
    - mongo-keys:/key

  monograph-server:
    <<: *svc
    # Source rebuild (same placeholder image; domain arrives via
    # NOTESNOOK_APP_HOST at runtime, so any domain works unmodified).
    build:
      context: ./monograph
    depends_on:
      notesnook-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # No env_file. This is a Bun service that reads exactly five variables
    # (server-app-url.patch: HOST, PORT, API_HOST, PUBLIC_URL,
    # NOTESNOOK_APP_HOST) plus the non-secret service-discovery block from
    # x-app-env. env_file was additionally handing it MONGO_PASS,
    # MINIO_ROOT_PASSWORD, SMTP_PASSWORD, NOTESNOOK_API_SECRET and the S3
    # service-account credentials, none of which it can read.
    environment:
      <<: *app-env
      API_HOST: http://notesnook-server:5264
      HOST: 0.0.0.0
      PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok?0:1)).catch(() =>
        process.exit(1))
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: dvalin21/notesnook-monograph:latest

  notesnook-db:
    <<: *svc
    # --auth REQUIRES --keyFile when authorization is enabled on a replica set,
    # even single-node. Verified: mongod exits with
    #   BadValue: security.keyFile is required when authorization is enabled
    #   with replica sets
    command: --replSet rs0 --bind_ip_all --auth --keyFile /run/secrets/mongo-keyfile
    depends_on:
      validate:
        condition: service_completed_successfully
      init-mongo-key:
        condition: service_completed_successfully
    # Only the two Mongo vars are injected, not the whole .env: mongod has no
    # business seeing MINIO_ROOT_PASSWORD or the SMTP password.
    environment:
      MONGO_USER: ${MONGO_USER}
      # What makes a FRESH install possible. With --auth on an empty volume there
      # are zero users, and the healthcheck authenticates as MONGO_USER before it
      # can run rs.initiate() -- so mongod never went healthy and
      # notesnook-server / identity-server / sse-server never started. Nothing in
      # the repository ever created that user; the running LXC only works
      # because its dbdata volume already had one, created by hand.
      #
      # The official image's entrypoint performs the documented bootstrap itself
      # on an empty /data/db: it starts a temporary auth-less mongod, creates
      # this user, then starts the real one. No init container, no change to the
      # start-up order, no change to the healthcheck.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_PASS: ${MONGO_PASS}
    healthcheck:
      # Must authenticate. Mongo's unauthenticated localhost exception is
      # DISABLED as soon as the first user exists -- and we just created one --
      # so the previous credential-less probe would fail and put the database
      # into a restart loop.
      test:
      - CMD-SHELL
      - mongosh "mongodb://$$MONGO_USER:$$MONGO_PASS@localhost:27017/admin?authSource=admin"
        --quiet --eval 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand("ping").ok'
      interval: 40s
      timeout: 30s
      retries: 5
      start_period: 60s
    hostname: notesnook-db
    image: mongo:8.0.30
    volumes:
    - dbdata:/data/db
    - mongo-keys:/run/secrets:ro

  notesnook-s3:
    <<: *svc
    command: server /data/s3 --console-address :9090
    depends_on:
      validate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD only. MinIO needs exactly these two
    # and reads nothing else from the environment. env_file was also giving it
    # MONGO_PASS, SMTP_PASSWORD, NOTESNOOK_API_SECRET and the S3 service-account
    # credentials -- the last of which is the credential the notes API holds, so
    # a compromise of object storage handed over the notes API's own key too.
    # That defeats the point of create-minio-app-user.sh.
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The embedded MinIO console is an admin UI for the whole object store,
      # reachable at minio.<domain>. It requires the ROOT credentials above,
      # and those root credentials were also present in eight other containers
      # until the env_file cleanup. An internet-reachable admin surface is not
      # worth keeping on a stack whose own README calls the host optional.
      #
      # Set MINIO_CONSOLE=on in .env if you administer the bucket through the
      # browser. Off by default: `mc` (scripts/create-minio-app-user.sh) does
      # everything this stack needs, including bucket creation and versioning.
      MINIO_BROWSER: ${MINIO_CONSOLE:-off}
      # NO TELEMETRY, NO PHONE-HOME. This is MinIO's callhome subsystem, which
      # can ship diagnostics off the box; the env var is the switch that disables
      # it. Verified on the shipped dvalin21/minio-notesnook image: with it set
      # to `off`, a running server with the console enabled and a successful
      # console login holds ZERO established outbound TCP connections --
      # /proc/net/tcp shows only loopback sockets.
      #
      # Set for three reasons that are not "privacy": (1) nothing about this
      # instance should leave it, (2) a self-host on a home network must not
      # make unsolicited outbound requests, and (3) if it ever did, that egress
      # is an availability and compliance question nobody should have to ask
      # about. The stack needs no other outbound connectivity from this service
      # except through the notesnook network.
      MINIO_CALLHOME_ENABLE: 'off'
    healthcheck:
      test:
      - CMD
      - wget
      - --tries=1
      - -nv
      - -q
      - http://127.0.0.1:9000/minio/health/live
      - -O
      - '-'
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: dvalin21/minio-notesnook:latest
    volumes:
    - s3data:/data/s3

  notesnook-server:
    <<: *svc
    # The `attachments` bucket is created by scripts/create-minio-app-user.sh,
    # which an operator must run before compose will even parse (S3_ACCESS_KEY
    # is a required interpolation). There used to be a `setup-s3` service here
    # that re-created the bucket on every boot, but it depended on
    # minio/mc:RELEASE.2025-08-13T08-35-41Z -- deleted from Docker Hub in
    # October 2025 -- so it made a clean install impossible on any machine
    # without that image cached, and `mc mb ... || true` swallowed the failure
    # so a missing bucket still produced a green stack.
    depends_on:
      identity-server:
        condition: service_healthy
      notesnook-s3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    # env_file replaced by an explicit list. This service reads its own Mongo
    # connection, the bucket-scoped S3 credential, the API secret it introspects
    # with, and the discovery/toggle values from Constants.cs -- not SMTP and
    # not MINIO_ROOT_*. env_file also meant a compromise of the notes API
    # yielded the MinIO ROOT credentials, which is exactly the privilege
    # separation create-minio-app-user.sh exists to provide.
    environment:
      <<: *app-env
      ASPNETCORE_HTTP_PORTS: '5264'
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_USER}:${MONGO_PASS}@notesnook-db:27017/?replSet=rs0&authSource=admin
      MONGODB_DATABASE_NAME: notesnook
      INSTANCE_NAME: ${INSTANCE_NAME}
      NOTESNOOK_CORS_ORIGINS: ${NOTESNOOK_CORS_ORIGINS}
      KNOWN_PROXIES: ${KNOWN_PROXIES}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      # The client secret this service presents when it introspects a token
      # against the identity server (Startup.cs AddOAuth2Introspection). It must
      # equal the identity server's NOTESNOOK_API_SECRET, which is the same value
      # as the ApiResource secret there.
      NOTESNOOK_API_SECRET: ${NOTESNOOK_API_SECRET}
      # Bucket-scoped service account, NOT MinIO root. The root credentials
      # grant s3:* on the server, so a compromise of the notes API would be a
      # compromise of object-storage administration. Policy enumerates only
      # the object actions this server needs -- s3:* on a bucket also grants
      # s3:DeleteBucket, which is not something the notes API should ever have.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY not set - run scripts/create-minio-app-user.sh}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID not set - run scripts/create-minio-app-user.sh}
      S3_BUCKET_NAME: attachments
      S3_INTERNAL_BUCKET_NAME: attachments
      S3_INTERNAL_SERVICE_URL: http://notesnook-s3:9000
      S3_REGION: us-east-1
      S3_SERVICE_URL: ${ATTACHMENTS_SERVER_PUBLIC_URL}
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:5264/health
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: dvalin21/notesnook-sync:latest
    volumes:
    - dpdata-notesnook:/app/.aspnet/DataProtection-Keys

  backup:
    <<: *svc
    restart: "no"
    command: sh /backup.sh
    depends_on:
      notesnook-db:
        condition: service_healthy
    # backup.sh needs the Mongo credentials to take its fsyncLock, but this
    # service has no env_file (it mounts .env as a FILE to copy into the dump).
    # Inject only the two variables it needs rather than the whole .env, so the
    # MinIO root password and SMTP password are not handed to this container.
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
    image: mongo:8.0.30
    profiles:
    - backup
    volumes:
    - ./backup.sh:/backup.sh:ro
    - ./.env:/envfile:ro
    - ./backups:/backups
    - dbdata:/vol/dbdata:ro
    - s3data:/vol/s3data:ro
    - dpdata-identity:/vol/dpdata-identity:ro
    - dpdata-notesnook:/vol/dpdata-notesnook:ro
    - dpdata-sse:/vol/dpdata-sse:ro
    - keystore-data:/vol/keystore-data:ro
    - gnupg-identity:/vol/gnupg-identity:ro

  sse-server:
    <<: *svc
    depends_on:
      identity-server:
        condition: service_healthy
      notesnook-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    # No env_file, and deliberately no MONGODB_*, S3_*, SMTP_* or MINIO_* here:
    # the SSE hub pushes notifications and reads nothing from storage. It does
    # need NOTESNOOK_API_SECRET -- the client secret it introspects tokens with --
    # plus the discovery block. Previously it received every credential in the
    # stack, including the Mongo root password.
    environment:
      <<: *app-env
      ASPNETCORE_HTTP_PORTS: '7264'
      NOTESNOOK_API_SECRET: ${NOTESNOOK_API_SECRET}
      INSTANCE_NAME: ${INSTANCE_NAME}
      MONOGRAPH_PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}
      KNOWN_PROXIES: ${KNOWN_PROXIES}
      # This service calls AddDefaultCors (Messenger/Startup.cs:66), which now
      # throws on an empty value instead of falling back to AllowAnyOrigin.
      # Without this the SSE hub would fail to start even though the browser
      # Origin header arrives on the EventSource request, not on the SSE stream.
      NOTESNOOK_CORS_ORIGINS: ${NOTESNOOK_CORS_ORIGINS}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - -O
      - /dev/null
      - http://127.0.0.1:7264/health
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: dvalin21/notesnook-sse:latest
    volumes:
    - dpdata-sse:/app/.aspnet/DataProtection-Keys

  themes-server:
    <<: *svc
    # env_file was missing here, so .env was never read and the documented
    # THEMES_REPO_URL was silently ignored in favour of the hardcoded default.
    # It is now passed explicitly rather than by re-adding env_file: this
    # service reads exactly one variable, and it is not a secret. Handing it the
    # whole .env would give a git-cloning process every credential in the stack.
    environment:
      HOST: 0.0.0.0
      PORT: 9000
      THEMES_REPO_URL: ${THEMES_REPO_URL:-https://github.com/streetwriters/notesnook-themes.git}
    healthcheck:
      test:
      - CMD
      - bun
      - -e
      - fetch('http://127.0.0.1:9000/health').then(r => { if (!r.ok) process.exit(1);
        }).catch(() => process.exit(1))
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    image: streetwriters/themes-server:latest
    volumes:
    - themesdata:/installs.json

  web:
    <<: *svc
    # No env_file here, deliberately. This is nginx serving a static bundle
    # plus a boot-time sed (web/entrypoint.sh); it reads six variables, all of
    # them PUBLIC URLs, and all six are passed below. env_file was handing this
    # service the Mongo root password, the MinIO root password, the SMTP
    # password, NOTESNOOK_API_SECRET, KNOWN_PROXIES and every S3/Mongo
    # credential -- none of which nginx can read or needs. An attacker who lands
    # in this container starts from nothing.
    build:
      context: ./web
      args:
        NN_API_HOST: ${NOTESNOOK_APP_PUBLIC_URL}
        NN_AUTH_HOST: ${AUTH_SERVER_PUBLIC_URL}
        NN_SSE_HOST: ${SSE_SERVER_PUBLIC_URL}
        NN_MONOGRAPH_HOST: ${MONOGRAPH_PUBLIC_URL}
    environment:
      # The six variables web/entrypoint.sh substitutes into the bundle.
      NOTESNOOK_APP_PUBLIC_URL: ${NOTESNOOK_APP_PUBLIC_URL}
      AUTH_SERVER_PUBLIC_URL: ${AUTH_SERVER_PUBLIC_URL}
      SSE_SERVER_PUBLIC_URL: ${SSE_SERVER_PUBLIC_URL}
      MONOGRAPH_PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}
      NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_HOST}
      THEMES_SERVER_PUBLIC_URL: ${THEMES_SERVER_PUBLIC_URL}
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 128M
        reservations:
          cpus: 0.1
          memory: 32M
    healthcheck:
      test:
      - CMD
      - wget
      - --tries=1
      - -nv
      - -q
      - http://127.0.0.1:80/health
      - -O
      - "-"
      interval: 40s
      timeout: 10s
      retries: 3
      start_period: 30s
    image: dvalin21/notesnook-web:latest

  validate:
    <<: *svc
    restart: "no"
    # Block scalar on purpose. The previous form hand-escaped every newline
    # inside a double-quoted scalar, which is how `exit 1 fi` happened -- a bash
    # syntax error that blocks the WHOLE stack, because every service declares
    # depends_on: validate: service_completed_successfully.
    command:
    - -c
    - |
      required_vars=(
        "SERVER_DOMAIN"
        "INSTANCE_NAME"
        "NOTESNOOK_API_SECRET"
        "DISABLE_SIGNUPS"
        "AUTH_SERVER_PUBLIC_URL"
        "NOTESNOOK_APP_PUBLIC_URL"
        "MONOGRAPH_PUBLIC_URL"
        "ATTACHMENTS_SERVER_PUBLIC_URL"
        "NOTESNOOK_APP_HOST"
        "SSE_SERVER_PUBLIC_URL"
        "MINIO_ROOT_USER"
        "MINIO_ROOT_PASSWORD"
        "MONGO_USER"
        "MONGO_PASS"
        "S3_ACCESS_KEY_ID"
        "S3_ACCESS_KEY"
        "CADDY_IP"
        "KNOWN_PROXIES"
        "NOTESNOOK_CORS_ORIGINS"
      )
      # SELF_HOSTED=0 sends signup at cloud endpoints that cannot work here and
      # the request then hangs until the proxy times out. Fail at boot instead.
      if [ "$${SELF_HOSTED:-1}" != "1" ]; then
        echo "Error: SELF_HOSTED must be 1 for a self-hosted stack." >&2
        exit 1
      fi
      for var in "$${required_vars[@]}"; do
        if [ -z "$${!var}" ]; then
          echo "Error: Required environment variable $$var is not set." >&2
          exit 1
        fi
      done
      # A URL that is present but malformed is worse than one that is missing,
      # because nothing downstream complains: Caddy still routes on SERVER_DOMAIN,
      # every healthcheck still passes, and the stack reports 11/11 healthy while
      # the server hands clients a URL it cannot serve. Two shapes break this way:
      #   - no scheme at all  (NOTESNOOK_APP_HOST=app.example.com), which the
      #     identity server pastes into a Location header and Caddy pastes into
      #     Access-Control-Allow-Origin; neither is legal in that position.
      #   - a host on the wrong domain, e.g. SERVER_DOMAIN was changed after
      #     copy-pasting the URLs. Routing and configuration silently disagree.
      # Both are cheap to catch here and expensive to discover from a client.
      url_vars=(
        "NOTESNOOK_APP_PUBLIC_URL"
        "AUTH_SERVER_PUBLIC_URL"
        "MONOGRAPH_PUBLIC_URL"
        "ATTACHMENTS_SERVER_PUBLIC_URL"
        "SSE_SERVER_PUBLIC_URL"
        "NOTESNOOK_APP_HOST"
      )
      # NOTESNOOK_CORS_ORIGINS is required above because AddDefaultCors now
      # refuses to start on an empty or wildcard value instead of falling back to
      # AllowAnyOrigin(). Reject the wildcard here as well, so the failure names
      # the variable instead of appearing as a service that dies at startup.
      # The policy sends exactly one Access-Control-Allow-Origin value, so a
      # comma-separated list silently honours only the first entry.
      case "$${NOTESNOOK_CORS_ORIGINS}" in
        *,*)
          echo "Error: NOTESNOOK_CORS_ORIGINS must be a single origin." >&2
          echo "       Got '$${NOTESNOOK_CORS_ORIGINS}'." >&2
          echo "       A list only ever honours its first entry." >&2
          exit 1
          ;;
        '*'|'*'*|*'*'*|*' '*)
          echo "Error: NOTESNOOK_CORS_ORIGINS must not be '*' or contain spaces." >&2
          echo "       Set it to your web client's origin, e.g. https://app.$${SERVER_DOMAIN}." >&2
          exit 1
          ;;
      esac
      # ── the pinned Caddy address must agree with what the apps trust ───────────
      # KNOWN_PROXIES tells the .NET services which upstream is allowed to set
      # X-Forwarded-Proto; CADDY_IP is the address actually assigned to caddy.
      # When they disagree, nothing errors loudly: the stack boots 11/11
      # healthy, and only SIGN-IN is dead, because the identity server builds
      # absolute URLs from a scheme it no longer trusts and the discovery
      # document advertises http:// instead of https://. The trap is worth a
      # boot-time failure. Commit 1690bf7 documents the exact downstream error:
      #   "Endpoint belongs to different authority: http://auth.<domain>/..."
      if [ -z "$${KNOWN_PROXIES:-}" ]; then
        echo "Error: KNOWN_PROXIES is not set. Copy it from .env.example." >&2
        exit 1
      fi
      if [ "$${KNOWN_PROXIES}" != "$${CADDY_IP}" ]; then
        echo "Error: KNOWN_PROXIES is '$${KNOWN_PROXIES}' but CADDY_IP is '$${CADDY_IP}'." >&2
        echo "       They must be identical, or sign-in breaks while the stack reports healthy." >&2
        echo "       CADDY_IP also has to sit inside the notesnook subnet in docker-compose.yml." >&2
        exit 1
      fi
      # The .env.example placeholders are non-empty, so the required-vars loop
      # above passes on a template that was never filled in -- and the stack
      # then boots healthy and fails at runtime instead. Catch the placeholders
      # here, where the cost is one second and a clear message.
      for var in "$${required_vars[@]}"; do
        case "$${!var}" in
          CHANGEME*|"")
            echo "Error: $$var still holds the .env.example placeholder." >&2
            exit 1
            ;;
        esac
      done
      for var in "$${url_vars[@]}"; do
        value="$${!var}"
        case "$$value" in
          *"://"*) ;;
          *)
            echo "Error: $$var must be an absolute URL including a scheme, got '$$value'." >&2
            exit 1
            ;;
        esac
        host="$${value#*://}"
        host="$${host%%/*}"
        host="$${host%%:*}"
        case "$$host" in
          *"$$SERVER_DOMAIN") ;;
          *)
            echo "Error: $$var points at '$$host', which is not on SERVER_DOMAIN '$$SERVER_DOMAIN'." >&2
            exit 1
            ;;
        esac
      done
      echo "All required environment variables are set and all public URLs are well-formed."
    entrypoint: /bin/bash
    env_file: *envfile
    image: vandot/alpine-bash

volumes:
  dbdata: null
  mongo-keys: null
  dpdata-identity: null
  dpdata-notesnook: null
  dpdata-sse: null
  keystore-data: null
  gnupg-identity: null
  s3data: null
  themesdata: null
