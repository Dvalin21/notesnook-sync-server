x-server-discovery: &server-discovery
  NOTESNOOK_SERVER_PORT: 5264
  NOTESNOOK_SERVER_HOST: notesnook-server
  IDENTITY_SERVER_PORT: 8264
  IDENTITY_SERVER_HOST: identity-server
  SSE_SERVER_PORT: 7264
  SSE_SERVER_HOST: sse-server
  SELF_HOSTED: 1
  IDENTITY_SERVER_URL: ${AUTH_SERVER_PUBLIC_URL}
  NOTESNOOK_APP_HOST: ${NOTESNOOK_APP_PUBLIC_URL}

x-env-files: &env-files
  - .env

services:
  validate:
    image: vandot/alpine-bash
    entrypoint: /bin/bash
    env_file: *env-files
    command:
      - -c
      - |
        # List of required environment variables
        required_vars=(
          "INSTANCE_NAME"
          "NOTESNOOK_API_SECRET"
          "DISABLE_SIGNUPS"
          "SMTP_USERNAME"
          "SMTP_PASSWORD"
          "SMTP_HOST"
          "SMTP_PORT"
          "AUTH_SERVER_PUBLIC_URL"
          "NOTESNOOK_APP_PUBLIC_URL"
          "MONOGRAPH_PUBLIC_URL"
          "ATTACHMENTS_SERVER_PUBLIC_URL"
        )

        # Check each required environment variable
        for var in "$${required_vars[@]}"; do
          if [ -z "$${!var}" ]; then
            echo "Error: Required environment variable $$var is not set."
            exit 1
          fi
        done

        echo "All required environment variables are set."
    # Ensure the validate service runs first
    restart: "no"

  notesnook-db:
    image: mongo:8.0.28
    hostname: notesnook-db
    restart: unless-stopped
    volumes:
      - dbdata:/data/db
    networks:
      - notesnook
    command: --replSet rs0 --bind_ip_all
    depends_on:
      validate:
        condition: service_completed_successfully
    healthcheck:
      test: echo 'try { rs.status() } catch (err) { rs.initiate() }; db.runCommand("ping").ok' | mongosh mongodb://localhost:27017 --quiet
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  notesnook-s3:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    volumes:
      - s3data:/data/s3
    environment:
      MINIO_BROWSER: "on"
    depends_on:
      validate:
        condition: service_completed_successfully
    env_file: *env-files
    command: server /data/s3 --console-address :9090
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s

  # There's no way to specify a default bucket in Minio so we have to
  # set it up ourselves. Uses the same minio image so no extra dependency.
  setup-s3:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      - notesnook-s3
    networks:
      - notesnook
    entrypoint: /bin/bash
    env_file: *env-files
    command:
      - -c
      - |
        until mc alias set minio http://notesnook-s3:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do
          sleep 1;
        done;
        mc mb minio/attachments -p || true

  identity-server:
    image: streetwriters/identity:v1.0-beta.32
    restart: unless-stopped
    ports:
      - 8264:8264
    volumes:
      - dpdata-identity:/app/.aspnet/DataProtection-Keys
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      notesnook-db:
        condition: service_started
      init-dpdata:
        condition: service_completed_successfully
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/identity?replSet=rs0
      MONGODB_DATABASE_NAME: identity

  notesnook-server:
    image: streetwriters/notesnook-sync:v1.0-beta.32
    restart: unless-stopped
    ports:
      - 5264:5264
    volumes:
      - dpdata-notesnook:/app/.aspnet/DataProtection-Keys
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      notesnook-s3:
        condition: service_started
      setup-s3:
        condition: service_completed_successfully
      identity-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:5264/health"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      MONGODB_CONNECTION_STRING: mongodb://notesnook-db:27017/?replSet=rs0
      MONGODB_DATABASE_NAME: notesnook
      S3_INTERNAL_SERVICE_URL: "http://notesnook-s3:9000"
      S3_INTERNAL_BUCKET_NAME: "attachments"
      S3_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      S3_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      S3_SERVICE_URL: "${ATTACHMENTS_SERVER_PUBLIC_URL}"
      S3_REGION: "us-east-1"
      S3_BUCKET_NAME: "attachments"

  sse-server:
    image: streetwriters/sse:v1.0-beta.32
    restart: unless-stopped
    ports:
      - 7264:7264
    volumes:
      - dpdata-sse:/app/.aspnet/DataProtection-Keys
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      identity-server:
        condition: service_started
      notesnook-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:7264/health"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery

  monograph-server:
    image: streetwriters/monograph:1.3.1
    restart: unless-stopped
    ports:
      - 6264:3000
    volumes:
      - dpdata-monograph:/app/.aspnet/DataProtection-Keys
    networks:
      - notesnook
    env_file: *env-files
    depends_on:
      notesnook-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000/api/health"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    environment:
      <<: *server-discovery
      API_HOST: http://notesnook-server:5264
      PUBLIC_URL: ${MONOGRAPH_PUBLIC_URL}

  cors-proxy:
    build:
      context: ./cors-proxy
      dockerfile: Dockerfile
    image: streetwriters/cors-proxy:latest
    ports:
      - 3000:3000
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      ALLOWED_ORIGINS: "${NOTESNOOK_CORS_ORIGINS:-*}"
    networks:
      - notesnook
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  init-dpdata:
    image: busybox:1.36
    restart: "no"
    volumes:
      - dpdata-identity:/volumes/dpdata-identity
      - dpdata-notesnook:/volumes/dpdata-notesnook
      - dpdata-sse:/volumes/dpdata-sse
      - dpdata-monograph:/volumes/dpdata-monograph
    entrypoint:
      - sh
      - -c
      - |
        echo "Setting DataProtection volume permissions..."
        for vol in /volumes/*; do
          chown -R 1000:1000 "$vol"
          echo "  chowned $(basename $vol)"
        done
        echo "Done."
    depends_on:
      validate:
        condition: service_completed_successfully

networks:
  notesnook:

volumes:
  dbdata:
  s3data:
  dpdata-identity:
  dpdata-notesnook:
  dpdata-sse:
  dpdata-monograph:

