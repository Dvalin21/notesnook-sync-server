name: Publish Docker images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege: this pushes to Docker Hub, so it needs no GitHub Packages,
# OIDC or attestation scopes. The previous revision granted id-token:write and
# attestations:write and only ever pushed to streetwriters/*.
permissions:
  contents: read

env:
  REGISTRY: dvalin21

jobs:
  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: notesnook-sync
            file: ./Notesnook.API/Dockerfile
            context: .
          - image: notesnook-identity
            file: ./Streetwriters.Identity/Dockerfile
            context: .
          - image: notesnook-sse
            file: ./Streetwriters.Messenger/Dockerfile
            context: .
          - image: cors-proxy
            file: ./cors-proxy/Dockerfile
            context: ./cors-proxy/
          # These two build from a pinned upstream commit inside the Dockerfile
          # (streetwriters/notesnook @ 143892e) and ship example.com placeholders
          # that web/entrypoint.sh swaps at boot, so no operator domain is ever
          # baked into a published image.
          - image: notesnook-web
            file: ./web/Dockerfile
            context: ./web/
            # web/Dockerfile declares these ARGs with NO default, and vite
            # inlines them at build time. Building without them bakes EMPTY
            # hosts and ships a broken image. Pin the placeholders: the
            # published image must never carry an operator's real domain, and
            # web/entrypoint.sh swaps in the real URLs at boot.
            build-args: |
              NN_API_HOST=https://sync.example.com
              NN_AUTH_HOST=https://auth.example.com
              NN_SSE_HOST=https://sse.example.com
              NN_MONOGRAPH_HOST=https://notes.example.com
            - image: notesnook-monograph
              file: ./monograph/Dockerfile
              context: ./monograph/
            # MinIO deleted minio/mc from Docker Hub in October 2025, so this is
            # compiled from a pinned upstream commit. It is what
            # scripts/create-minio-app-user.sh uses to create the attachments
            # bucket and the bucket-scoped service account.
            - image: mc
              file: ./mc/Dockerfile
              context: ./mc/
    steps:
      # Actions are pinned by SHA. A tag can be repointed at new code without a
      # review, and this workflow holds a Docker Hub credential.
      - name: Check out the repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4d60b7d1550c85d4e0d63d0c2b6f # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.10.0

      - name: Log in to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.15.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
