name: CI

on:
  push:
    # drop-setup-s3 is the branch this fork is developed on. Without it every
    # push compiles nothing, which is how 4 broken builds sat undetected.
    branches: [main, master, drop-setup-s3]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Shell scripts parse
        # -n parses without executing. Each check is a separate step or a
        # separate `||` branch on purpose: chaining with && lets a later
        # success mask an earlier failure.
        run: |
          set -e
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "SYNTAX ERROR in $f"; exit 1; }
            echo "  ok  $f"
          done

      - name: Compose file is valid
        # --env-file .env.ci, NOT the real .env. .env is gitignored, so without
        # this the step failed on EVERY push at the ${S3_ACCESS_KEY:?} guard
        # and the three steps below it never ran at all. .env.ci holds dummy
        # values only -- it is the compose PARSER being exercised, not a deploy.
        #
        # The cp is not redundant with --env-file. Passing --env-file does not
        # stop Compose stat'ing the default .env: on a clean checkout this step
        # died with "env file .../.env not found" and exited 1. Reproduced
        # locally against a .env-free tree of HEAD; putting the same dummy file
        # at both paths fixes it, and --env-file still wins for interpolation,
        # so the values actually checked are .env.ci's.
        run: |
          cp .env.ci .env
          docker compose --env-file .env.ci config -q

      - name: Compose structure invariants
        # restart policy + log rotation + networks + volume declarations
        run: python3 scripts/check-compose.py

      - name: Compose one-shot scripts parse
        # Catches the class of bug where a hand-escaped YAML scalar yields a
        # shell syntax error in a service the entire stack depends on.
        run: ./scripts/check-compose-scripts.sh

      # The Caddyfile is a deployed artifact even though it is not compiled:
      # it ships in the repo and is the only thing standing between MinIO and
      # CVE-2026-40344 / CVE-2026-41145. A syntax error here means the reverse
      # proxy does not start at all, which is a total outage, and a misplaced
      # `handle` block silently disables the CVE guard (see the check-compose.py
      # invariant). Validate it against the real binary.
      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD":/c -w /c -e DOMAIN=example.com -e MINIO_CONSOLE=off \
            caddy:alpine caddy validate --config Caddyfile --adapter caddyfile

      # The whole solution is ~166 files of C# and CI did not compile any of
      # it: a syntax error, a bad csproj, or a renamed symbol would merge green
      # and break the published image. 'dotnet build' is the cheapest gate that
      # closes that class. Restore is cached on the lock inputs so repeat runs
      # stay fast; there is no test project in the solution, so this is a compile
      # check, not a behaviour check.
      - name: Set up .NET
        # The previous pin, 4a2b4d152a186b03afb040b64497b91d97f2ce4c, does not
        # exist in actions/setup-dotnet: the API returns 422 "No commit found
        # for SHA". The job died during action resolution, so this build gate
        # has never once run. SHA below is the current v4 tag head, resolved
        # against the GitHub API rather than copied from anywhere.
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: .NET solution builds
        run: dotnet build Notesnook.sln -c Release --nologo

      - name: cors-proxy typechecks and builds
        working-directory: cors-proxy
        run: |
          docker run --rm -v "$PWD:/app" -w /app oven/bun:1.3.5-slim \
            sh -c 'bun install --frozen-lockfile && bun run build'
